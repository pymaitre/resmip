[project]
name = "resmip"
description = "Python library for Medical Image Processing (MIP)."
license = "LGPL-2.1-or-later"
version = "0.0.6.dev0"
readme = "README.md"
authors = [{name = "G. Palazzo, M.G. Ubeira-Gabellini"}]
requires-python = '>=3.11,<3.15'
dependencies = [
    "numpy (>=2.0.0,<3.0.0)",
    "pydicom (>=3.0.1,<4.0.0)",
    "simpleitk (>=2.4.1,<3.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "matplotlib (>=3.10.7,<4.0.0)"
]

[project.urls]
documentation = "https://pymaitre.github.io/resmip/latest/"
repository = "https://github.com/pymaitre/resmip"

[tool.poetry]
requires-poetry = '>=2.0.0,<3.0.0'

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.4.7"
sphinx-rtd-theme = "^3.0.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
prospector = "^1.16.1"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
ruff = "^0.14.5"
dicom-validator = "^0.8.2"

[build-system]
requires = ['poetry-core (>=2.0.0,<3.0.0)']
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["--cov=resmip"]

[tool.pylint.DESIGN]
max-args = 8
max-locals = 18

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
