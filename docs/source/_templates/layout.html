{% extends "!layout.html" %}

{% block sidebartitle %}
{{ super() }}
<select id="version-switcher" aria-label="Documentation version" style="width: 100%; margin-top:
0.5em;" hidden></select>
<script>
    (function () {
    var switcher = document.getElementById("version-switcher");
    var siteRoot = new URL("{{ pathto('_static/', 1) }}../../", window.location.href);
    var currentVersion = window.location.href.slice(siteRoot.href.length).split("/")[0];
    fetch(new URL("versions.json", siteRoot))
        .then(function (response) {
        if (!response.ok) {
            throw new Error(response.status);
        }
        return response.json();
        })
        .then(function (versions) {
        versions.forEach(function (version) {
            var option = document.createElement("option");
            option.value = version;
            option.textContent = version;
            option.selected = version === currentVersion;
            switcher.appendChild(option);
        });
        switcher.addEventListener("change", function () {
            window.location.href = new URL(switcher.value + "/index.html", siteRoot).href;
        });
        switcher.hidden = false;
        })
        .catch(function () {});
    })();
</script>
{% endblock %}
