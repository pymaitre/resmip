strictness: medium

doc-warnings: true

max-line-length: 100

inherits:
  - default

ignore-paths:
  - venv
  - .venv
  - build
  - docs
  - tests/Dicom

ignore-patterns:
  - .*templates\.py$
  - .*__init__\.py$

pydocstyle:
  disable:
    - D203
    - D212

pylint:
  disable:
    - useless-suppression
    - django-not-available
  options:
    max-locals: 18
    max-args: 8
