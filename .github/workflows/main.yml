name: Test
on:
  push:
  pull_request:
jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Install dependencies
        run: |
          poetry install --with test
      - name: Locate DICOM standard cache
        id: dicom-standard
        run: poetry run python -m tests.dicom_standard >> "$GITHUB_OUTPUT"
      - name: Cache DICOM standard
        uses: actions/cache@v6
        with:
          path: ${{ steps.dicom-standard.outputs.path }}
          key: dicom-standard-${{ runner.os }}-${{ steps.dicom-standard.outputs.key }}
      - name: Test code
        run: |
          poetry run pytest
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Install dependencies
        run: |
          poetry install --with test
      - name: Control code structure
        run: |
          poetry run prospector
          poetry run pylint tests
          poetry run ruff check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: snok/install-poetry@v1
      - name: Install dependencies
        run: poetry install --with docs
      - name: Build documentation
        working-directory: docs
        run: poetry run make html
      - name: Run doctests
        working-directory: docs
        run: poetry run make doctest
